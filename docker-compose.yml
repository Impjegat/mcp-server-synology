services:
  # Synology MCP Server
  # Configure via ~/.config/synology-mcp/settings.json
  synology-mcp:
    build: .
    container_name: synology-mcp-server
    command: ["python", "main.py"]
    network_mode: host  # Allow access to local network (192.168.x.x)
    # `.env` is handed to the container at start, not baked into the image
    # (.dockerignore keeps it out of the build context on purpose). It's
    # optional: settings.json, mounted below, is the other way to configure
    # this. `required: false` needs Docker Compose v2.24 or later.
    env_file:
      - path: .env
        required: false
    environment:
      - XDG_CONFIG_HOME=/home/mcpuser/.config
    volumes:
      - ./logs:/app/logs
      # Mount XDG config directory for settings.json
      # On macOS: ~/.config/synology-mcp -> /home/mcpuser/.config/synology-mcp
      # On Linux: ~/.config/synology-mcp -> /home/mcpuser/.config/synology-mcp
      - ${XDG_CONFIG_HOME:-$HOME/.config}/synology-mcp:/home/mcpuser/.config/synology-mcp:ro
    # stdin_open (no tty): every client config in the README launches this
    # via `docker-compose run --rm`, speaking JSON-RPC over stdin/stdout —
    # a TTY would add terminal semantics (echo, line buffering) that don't
    # suit a binary/line-oriented RPC stream. No restart policy either:
    # restart policies are for a long-running service started with `up`,
    # not a one-off, auto-removed container tied to the client's process.
    stdin_open: true
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
