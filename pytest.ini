[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Deliberately not here: -v (a line per test is noise in CI; pass it yourself),
# -s (keeps print() out of the log unless a test fails; pass it for live output)
# and --disable-warnings / filterwarnings (the suite has no warnings, and hiding
# them would hide the first one a dependency update brings).
addopts =
    --tb=short
    --strict-markers
# Every marker the tests use is registered here, not in tests/conftest.py;
# --strict-markers turns an unregistered one into an error, and
# tests/test_pytest_config.py fails if this file stops being read.
markers =
    real_nas: tests that require real Synology NAS connection
    destructive: tests that modify NAS state (create/delete downloads)
    slow: tests that may take several seconds to complete
    docker: tests that run the built adapter and broker images (SYNOLOGY_TEST_DOCKER=1)
