<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Synology Broker</title>
  <link rel="stylesheet" href="style.css">
  <script src="view.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header>
    <h1>Synology Broker</h1>
    <span id="pill" class="pill stopped">Stopped</span>
  </header>

  <section id="start-panel">
    <form id="start-form" autocomplete="off">
      <label id="password-label" for="password">Windows password for the Synbroker account</label>
      <input id="password" type="password" autocomplete="off" spellcheck="false">
      <button id="start" type="submit">Start Broker</button>
    </form>
  </section>

  <section id="progress-panel" hidden>
    <div id="progress" class="progress" role="progressbar" aria-label="Starting the broker"
         aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="progress-bar"></div></div>
  </section>

  <section id="running-panel" hidden>
    <div class="buttons">
      <button id="open" class="primary" data-page="/">Open Broker</button>
      <button id="login-all" data-page="/login-all">Sign in all clients</button>
      <button id="settings" data-page="/settings">Settings</button>
      <button id="log" data-page="/log">Log</button>
      <button id="stop" class="danger">Stop Broker</button>
    </div>
  </section>

  <div id="notices" aria-live="polite"></div>
</body>
</html>
