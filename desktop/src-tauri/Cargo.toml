[package]
name = "synology-broker"
version = "0.1.0"
description = "Portable desktop shell for the Synology MCP broker"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Windows' own certificate store (Schannel), so the broker's certificate is judged
# exactly as the browser pane judges it. No proxy: this only ever talks to loopback.
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json"] }
tokio = { version = "1", features = ["time"] }
url = "2"
zeroize = "1"

[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
]

[profile.release]
# A small single .exe: the point of the app is that it is one portable file.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
