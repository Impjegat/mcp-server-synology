name: Tests

# Runs the unit tests on Linux and Windows, the stdio end-to-end test against
# the Docker image, and lint/format on Linux.
#
# Windows is here because the project is developed there and a Linux-only run
# hid Windows-only failures (see plans/shipped/2026-09-28-windows-test-isolation).
#
# No secrets are used. Tests marked `real_nas` need a live NAS and credentials
# and are excluded; everything else mocks its network calls (tests/conftest.py
# also blocks outbound connections outright for tests not marked real_nas).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -m "not real_nas"

  docker:
    # The image MCP clients actually launch, driven the way the README tells
    # them to: the same stdio end-to-end test as above, run against the
    # container through `docker compose run --rm` instead of `python main.py`.
    # The three -e flags hand the test's server settings (no auto-login,
    # restricted mode) through to the container.
    name: docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      # Only for the test runner itself (it imports the server's modules).
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build the image
        run: docker compose build
      - name: Run the stdio protocol tests against the container
        env:
          MCP_STDIO_SERVER_COMMAND: >-
            ["docker", "compose", "-f", "${{ github.workspace }}/docker-compose.yml",
            "run", "--rm", "-e", "AUTO_LOGIN", "-e", "RESTRICTED_MODE", "-e", "LOG_LEVEL",
            "synology-mcp"]
        run: python -m pytest tests/test_stdio_protocol.py

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # Pinned so a new release of either tool can't turn an unrelated PR red;
      # bump them deliberately (and reformat if needed).
      - name: Install linters
        run: python -m pip install black==26.5.1 ruff==0.16.9
      - name: ruff
        run: ruff check src/ main.py tests/
      - name: black
        run: black --check src main.py tests
