name: Tests

# Runs the unit tests on Linux and Windows, the stdio end-to-end test and the
# adapter, broker and legacy images through Docker, and lint/format on Linux.
#
# Windows is here because the project is developed there and a Linux-only run
# hid Windows-only failures (see plans/shipped/2026-09-28-windows-test-isolation).
# The suite includes the real adapter and the real broker started as processes,
# with a fake NAS and fake authentication, so the client-to-adapter-to-broker
# path is exercised on both systems.
#
# No secrets are used. Tests marked `real_nas` need a live NAS and credentials
# and are excluded; everything else mocks its network calls (tests/conftest.py
# also blocks outbound connections outright for tests not marked real_nas).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -m "not real_nas"
      # The tool catalog is generated from the registry and the broker's default
      # policy; a test compares them too, this makes a stale file obvious.
      - name: Tool catalog is up to date
        run: python scripts/generate_tool_catalog.py --check

  docker:
    # The images MCP clients and the broker host actually run.
    #
    # Legacy: driven the way the README tells clients to, the same stdio
    # end-to-end test as above run against the container through
    # `docker compose run --rm` instead of `python main.py`. The three -e flags
    # hand the test's server settings (no auto-login, restricted mode) through.
    #
    # Adapter and broker: built from their own targets, then checked by
    # tests/test_docker_images.py: what each image contains, that it runs as a
    # non-root account on a read-only filesystem, that the adapter refuses a NAS
    # credential, and that a real broker container answers a real adapter over
    # TLS, signed in to nothing (a fake NAS address, no credential anywhere).
    # The broker compose template is validated as Compose reads it.
    name: docker images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      # Only for the test runner itself (it imports the server's modules).
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Build the legacy image
        run: docker compose build
      - name: Build the adapter image
        run: docker build --target adapter -t synology-mcp-adapter:ci .
      - name: Build the broker image
        run: docker build --target broker -t synology-mcp-broker:ci .
      - name: Validate the broker compose template
        run: >-
          docker compose --env-file deploy/broker/broker.env.example
          -f deploy/broker/docker-compose.yml config --quiet
      - name: Run the stdio protocol tests against the legacy container
        env:
          MCP_STDIO_SERVER_COMMAND: >-
            ["docker", "compose", "-f", "${{ github.workspace }}/docker-compose.yml",
            "run", "--rm", "-e", "AUTO_LOGIN", "-e", "RESTRICTED_MODE", "-e", "LOG_LEVEL",
            "synology-mcp"]
        run: python -m pytest tests/test_stdio_protocol.py
      - name: Test the adapter and broker images
        env:
          SYNOLOGY_TEST_DOCKER: "1"
          SYNOLOGY_TEST_ADAPTER_IMAGE: synology-mcp-adapter:ci
          SYNOLOGY_TEST_BROKER_IMAGE: synology-mcp-broker:ci
        run: python -m pytest tests/test_docker_images.py

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # Pinned so a new release of either tool can't turn an unrelated PR red;
      # bump them deliberately (and reformat if needed).
      - name: Install linters
        run: python -m pip install black==26.5.1 ruff==0.16.9
      - name: ruff
        run: ruff check src/ main.py adapter_main.py broker_main.py scripts/ docker/ tests/
      - name: black
        run: black --check src/ main.py adapter_main.py broker_main.py scripts/ docker/ tests/
