name: Tests

# Runs the unit tests on Linux and Windows, plus lint/format on Linux.
#
# Windows is here because the project is developed there and a Linux-only run
# hid Windows-only failures (see plans/shipped/2026-09-28-windows-test-isolation).
#
# No secrets are used. Tests marked `real_nas` need a live NAS and credentials
# and are excluded; everything else mocks its network calls (tests/conftest.py
# also blocks outbound connections outright for tests not marked real_nas).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -m "not real_nas"

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # Pinned so a new release of either tool can't turn an unrelated PR red;
      # bump them deliberately (and reformat if needed).
      - name: Install linters
        run: python -m pip install black==26.5.1 ruff==0.16.9
      - name: ruff
        run: ruff check src/ main.py tests/
      - name: black
        run: black --check src main.py tests
